[workspace]
resolver = "3"

members = ["ntk-app", "ntk-core", "ntk-renderer"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
notetaker-core = { path = "../ntk-core" }
notetaker-ui = { path = "../ntk-ui" }
notetaker-render = { path = "../ntk-renderer" }

log = "0.4"
env_logger = "0.11"
pollster = "0.4"
thiserror = "2.0.20"

egui = "0.36"
wgpu = "30.0.1"
egui-wgpu = "0.36"
winit = "0.30.11"
egui-winit = "0.36"
cosmic-text = "0.19.0"
